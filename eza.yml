colourful: true
foreground: "#d1b897"

# eza/ls colours for the Skeptic palette, warm sand edition.
# Directories, permissions, sizes and dates sit in the tan / gold / sand
# family so the listing reads warm against the deep teal background.
# Executables stay green. Nothing decorative is red or amber; errors and
# warnings keep those colours everywhere else.

filekinds:
  normal:        { foreground: "#d1b897" }
  directory:     { foreground: "#e3bd86", bold: true }
  symlink:       { foreground: "#d9a86e" }
  pipe:          { foreground: "#b9a382" }
  block_device:  { foreground: "#b9a382" }
  char_device:   { foreground: "#b9a382" }
  socket:        { foreground: "#d9a86e" }
  special:       { foreground: "#b9a382" }
  executable:    { foreground: "#8cde94", bold: true }
  mount_point:   { foreground: "#e3bd86", bold: true }

perms:
  user_read:         { foreground: "#c2b08f" }
  user_write:        { foreground: "#e3bd86" }
  user_execute_file: { foreground: "#8cde94", bold: true }
  user_execute_other: { foreground: "#8cde94" }
  group_read:        { foreground: "#c2b08f" }
  group_write:       { foreground: "#e3bd86" }
  group_execute:     { foreground: "#8cde94" }
  other_read:        { foreground: "#c2b08f" }
  other_write:       { foreground: "#e3bd86" }
  other_execute:     { foreground: "#8cde94" }
  special_user_file: { foreground: "#e3bd86", bold: true }
  special_other:     { foreground: "#8a7f6a" }
  attribute:         { foreground: "#126367" }

size:
  major:         { foreground: "#d8b98c" }
  minor:         { foreground: "#c2a377" }
  number_byte:   { foreground: "#d8b98c" }
  number_kilo:   { foreground: "#d8b98c" }
  number_mega:   { foreground: "#d8b98c" }
  number_giga:   { foreground: "#d8b98c" }
  number_huge:   { foreground: "#d8b98c" }
  unit_byte:     { foreground: "#c2a377" }
  unit_kilo:     { foreground: "#c2a377" }
  unit_mega:     { foreground: "#c2a377" }
  unit_giga:     { foreground: "#c2a377" }
  unit_huge:     { foreground: "#c2a377" }

users:
  user_you:     { foreground: "#e6d9c3" }
  user_root:    { foreground: "#e3bd86", bold: true }
  user_other:   { foreground: "#c2b08f" }
  group_yours:  { foreground: "#e6d9c3" }
  group_other:  { foreground: "#c2b08f" }
  group_root:   { foreground: "#e3bd86", bold: true }

links:
  normal:          { foreground: "#d9a86e" }
  multi_link_file: { foreground: "#d9a86e", underline: true }

git:
  new:        { foreground: "#8cde94" }
  modified:   { foreground: "#d9a86e" }
  deleted:    { foreground: "#b9a382" }
  renamed:    { foreground: "#e6d9c3" }
  typechange: { foreground: "#d9a86e" }
  ignored:    { foreground: "#126367" }
  conflicted: { foreground: "#e3bd86", bold: true }

git_repo:
  branch_main:  { foreground: "#e6d9c3" }
  branch_other: { foreground: "#c2b08f" }
  git_clean:    { foreground: "#8cde94" }
  git_dirty:    { foreground: "#e3bd86" }

security_context:
  colon: { foreground: "#126367" }
  user:  { foreground: "#e6d9c3" }
  role:  { foreground: "#c2b08f" }
  typ:   { foreground: "#c2b08f" }
  range: { foreground: "#c2b08f" }

file_type:
  image:       { foreground: "#e3bd86" }
  video:       { foreground: "#d9a86e" }
  music:       { foreground: "#c2a377" }
  lossless:    { foreground: "#c2a377" }
  crypto:      { foreground: "#8cde94" }
  document:    { foreground: "#d8b98c" }
  compressed:  { foreground: "#d9a86e" }
  temp:        { foreground: "#8a7f6a" }
  compiled:    { foreground: "#b9a382" }
  build:       { foreground: "#b9a382" }
  source:      { foreground: "#b9d98a" }

punctuation:         { foreground: "#126367" }
date:                { foreground: "#a89a80" }
inode:               { foreground: "#b9a382" }
blocks:              { foreground: "#b9a382" }
header:              { foreground: "#e6d9c3", bold: true }
octal:               { foreground: "#c2a377" }
flags:               { foreground: "#8a7f6a" }

symlink_path:        { foreground: "#d9a86e" }
control_char:        { foreground: "#8a7f6a" }
broken_symlink:      { foreground: "#d1b897", underline: true }
broken_path_overlay: { foreground: "#d1b897", underline: true }
